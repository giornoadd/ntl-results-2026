<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Run Khao Yai 2026 — NTL Club Finishers Leaderboard</title>
<style>
  :root {
    --bg0: #070B14;
    --bg1: #0B1120;
    --card: rgba(17, 24, 39, 0.94);
    --border: rgba(148, 163, 184, 0.22);
    --text: #F8FAFC;
    --muted: #94A3B8;
    --manda: #38BDF8;
    --itsec: #F59E0B;
    --itsys: #10B981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 85% 10%, rgba(56,189,248,0.16), transparent 45%),
                radial-gradient(circle at 12% 90%, rgba(245,158,11,0.12), transparent 45%),
                linear-gradient(135deg, var(--bg0), var(--bg1) 55%, #0F172A);
    color: var(--text);
    font-family: 'Noto Sans Thai UI', 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 26px 20px 60px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 2px; color: var(--manda); margin-bottom: 6px; }
  h1 { font-size: clamp(28px, 4vw, 48px); font-weight: 900; margin-bottom: 8px; }
  .sub { color: var(--muted); font-size: 15px; margin-bottom: 20px; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px 18px; }
  .stat-val { font-size: 32px; font-weight: 900; margin-top: 4px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .seg { display: inline-flex; background: #0F172A; border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 3px; flex-wrap: wrap; }
  .seg button {
    background: transparent; border: none; color: var(--muted); padding: 7px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .seg button.active { background: var(--manda); color: #062033; }
  .sec-title { font-size: 20px; font-weight: 800; margin: 22px 0 12px; display: flex; align-items: center; gap: 10px; }
  .list { display: grid; gap: 10px; }
  .row {
    display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center;
    background: var(--card); border: 1px solid var(--border); border-left-width: 5px;
    border-radius: 16px; padding: 14px 16px; cursor: pointer; transition: transform 0.14s, border-color 0.14s;
  }
  .row:hover { transform: translateY(-2px); border-color: var(--manda); }
  .rk {
    width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 18px; border: 2px solid #475569; background: #0F172A;
  }
  .rk-1 { border-color: #FBBF24; background: #451A03; color: #FEF08A; }
  .rk-2 { border-color: #CBD5E1; background: #1E293B; color: #F8FAFC; }
  .rk-3 { border-color: #F97316; background: #431407; color: #FED7AA; }
  .pill {
    display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--border); margin-left: 8px; vertical-align: middle;
  }
  .right { text-align: right; }
  .tm { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .pc { font-size: 13px; font-weight: 700; color: var(--muted); }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(3,7,18,0.82); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; padding: 18px; z-index: 50;
  }
  .modal-bg.open { display: flex; }
  .modal {
    width: min(560px, 100%); background: #0B1120; border: 1px solid var(--border);
    border-radius: 22px; padding: 24px;
  }
  .kv { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(148,163,184,0.12); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">ALLIANZ AYUDHYA WORLD RUN 2026 • KHAO YAI</div>
  <h1>สรุปผลการแข่งขัน &amp; อันดับสมาชิกชมรม NTL</h1>
  <p class="sub">TAT Eco Park เขาใหญ่ • 22 พฤศจิกายน 2026 • เฉพาะนักกีฬาชมรมที่ส่งผลเข้าร่วมจริง 16 คน</p>

  <div class="stats-grid" id="statsGrid"></div>
  <div class="controls">
    <div class="seg" id="catTabs"></div>
    <div class="seg" id="teamTabs"></div>

<div class="modal-bg" id="modalBg">

</div>

const TEAM_COLORS = {

  ITSystem: { primary: "#10B981", fg: "#A7F3D0", bg: "#064E3B" },
};

let catFilter = "ALL";
let teamFilter = "All";

function renderStats() {
  const s = RACE_DATA.summary;
  document.getElementById("statsGrid").innerHTML = `
    <div class="card"><div class="pc">ผู้เข้าร่วมจบเรซทั้งหมด</div><div class="stat-val" style="color:var(--manda)">${s.total_finishers} คน</div></div>
    <div class="card"><div class="pc">21.1 KM Half Marathon</div><div class="stat-val" style="color:#38BDF8">${s.half_marathon_21k_count} คน</div></div>
    <div class="card"><div class="pc">10 KM Mini Marathon</div><div class="stat-val" style="color:#10B981">${s.mini_marathon_10k_count} คน</div></div>
    <div class="card"><div class="pc">Mandalorian / ITSystem / ITSec</div><div class="stat-val" style="font-size:24px;margin-top:10px">${s.team_counts.Mandalorian} / ${s.team_counts.ITSystem} / ${s.team_counts.ITSec}</div></div>
    <div class="card"><div class="pc">รางวัล Top 100 &amp; AG</div><div class="stat-val" style="color:var(--itsec)">${s.top100_awards} / ${s.ag_podium_awards}</div></div>

function renderControls() {
  const cats = [["ALL", "ทั้งหมด (16 คน)"], ["21.1KM", "21.1 KM (9 คน)"], ["10KM", "10 KM (7 คน)"]];
  document.getElementById("catTabs").innerHTML = cats.map(([k, lbl]) =>
    `<button class="${catFilter===k?"active":""}" onclick="catFilter='${k}';renderAll()">${lbl}</button>`
  ).join("");
  const teams = [["All", "ทุกทีม"], ["Mandalorian", "Mandalorian"], ["ITSystem", "ITSystem"], ["ITSec", "ITSec"]];
  document.getElementById("teamTabs").innerHTML = teams.map(([k, lbl]) =>
    `<button class="${teamFilter===k?"active":""}" onclick="teamFilter='${k}';renderAll()">${lbl}</button>`
  ).join("");
}

function renderRows(list) {
  return `<div class="list">` + list.map(r => {
    const tc = TEAM_COLORS[r.team];
    const rkCls = r.club_rank <= 3 ? `rk-${r.club_rank}` : "";
    const sub = [r.award, r.official_overall ? `Overall ${r.official_overall} | AG ${r.official_ag}` : "", r.gps_distance_km ? `${r.gps_distance_km.toFixed(2)} km` : ""].filter(Boolean).join(" • ") || r.note;
    return `<div class="row" style="border-left-color:${tc.primary}" onclick="openDetail('${r.category}', ${r.club_rank})">
      <div class="rk ${rkCls}">${r.club_rank}</div>
      <div>
        <div><strong style="font-size:19px">${r.name}</strong>
          <span class="pill" style="color:${tc.fg};background:${tc.bg};border-color:${tc.primary}">${r.team}</span>
          <span class="pill" style="color:${r.time_source==='Chip'?'#7DD3FC':'#DDD6FE'}">${r.time_source.toUpperCase()}</span>
        </div>
        <div class="pc" style="margin-top:4px;color:${r.award?'#FDE68A':'var(--muted)'}">${sub}</div>
      </div>
      <div class="right">
        <div class="tm">${r.time_str}</div>
        <div class="pc" style="color:${tc.fg}">${r.pace_str} /km</div>
      </div>
    </div>`;
  }).join("") + `</div>`;
}

function renderBoard() {
  const cats = catFilter === "ALL" ? ["21.1KM", "10KM"] : [catFilter];
  const html = cats.map(c => {
    const list = RACE_DATA.finishers
      .filter(r => r.category === c && (teamFilter === "All" || r.team === teamFilter))
      .sort((a, b) => a.club_rank - b.club_rank);
    const label = c === "21.1KM" ? "21.1 KM Half Marathon" : "10 KM Mini Marathon";
    return `<div class="sec-title">${label} (${list.length} คน)</div>` + (list.length ? renderRows(list) : `<div class="card pc">ไม่มีนักกีฬาในตัวกรองนี้</div>`);
  }).join("");
  document.getElementById("boardContainer").innerHTML = html;
}

function openDetail(cat, rank) {
  const r = RACE_DATA.finishers.find(x => x.category === cat && x.club_rank === rank);
  if (!r) return;
  const tc = TEAM_COLORS[r.team];
  document.getElementById("modalBody").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span class="pill" style="margin-left:0;color:${tc.fg};background:${tc.bg};border-color:${tc.primary}">${r.category} • อันดับชมรม #${r.club_rank} • ${r.team}</span>
      <button onclick="document.getElementById('modalBg').classList.remove('open')" style="background:#1E293B;color:#F8FAFC;border:1px solid var(--border);padding:5px 12px;border-radius:999px;cursor:pointer">ปิด ✕</button>
    </div>
    <h2 style="font-size:28px;margin-bottom:4px">${r.name}</h2>
    <div style="font-size:38px;font-weight:900;color:${tc.primary};margin-bottom:14px">${r.time_str} <span style="font-size:18px;color:var(--muted)">(${r.pace_str} /km • ${r.time_source})</span></div>
    ${r.gun_time_str ? `<div class="kv"><span>Gun Time</span><strong>${r.gun_time_str}</strong></div>` : ""}
    ${r.bib_no ? `<div class="kv"><span>BIB / รุ่นอายุ</span><strong>${r.bib_no} (${r.age_group})</strong></div>` : ""}
    ${r.official_overall ? `<div class="kv"><span>Official Overall / Gender / AG</span><strong>${r.official_overall} | ${r.official_gender} | ${r.official_ag}</strong></div>` : ""}
    ${r.splits ? `<div class="kv"><span>CheckTime Splits</span><strong>${r.splits}</strong></div>` : ""}
    ${r.gps_distance_km ? `<div class="kv"><span>GPS Distance</span><strong>${r.gps_distance_km.toFixed(2)} km</strong></div>` : ""}
    ${r.avg_hr ? `<div class="kv"><span>Avg Heart Rate</span><strong>${r.avg_hr} bpm</strong></div>` : ""}
    ${r.cadence_spm ? `<div class="kv"><span>Cadence</span><strong>${r.cadence_spm} spm</strong></div>` : ""}
    ${r.award ? `<div class="kv"><span>Award / Milestone</span><strong style="color:#FDE68A">${r.award}</strong></div>` : ""}
    <div class="kv" style="border:none"><span>หมายเหตุ / หลักฐาน</span><span style="text-align:right;max-width:65%;color:var(--muted)">${r.note}</span></div>
  `;
  document.getElementById("modalBg").classList.add("open");
}

document.getElementById("modalBg").onclick = (e) => { if (e.target.id === "modalBg") e.target.classList.remove("open"); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.getElementById("modalBg").classList.remove("open"); });

function renderAll() { renderStats(); renderControls(); renderBoard(); }
renderAll();
</script>
</body>
</html>
