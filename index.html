function heroInfo(m) {
  if (m.primary_pillar === "Run") return { val: fmtNum(m.run_km, 1) + " km", sub: `ระยะวิ่งสะสม (${m.team_run_share_pct}% ของทีม ${m.team})`, col: "#38BDF8" };
  if (m.primary_pillar === "Walk") return { val: fmtNum(m.walk_km, 1) + " km", sub: `ระยะเดินสะสม (${m.team_walk_share_pct}% ของทีม ${m.team})`, col: "#10B981" };
  if (m.primary_pillar === "Other") return { val: fmtNum(m.other_exercise_hours, 1) + " ชม.", sub: `เวลาออกกำลังกายอื่น (${m.team_other_hours_share_pct}% ของทีม ${m.team})`, col: "#F59E0B" };
  return { val: fmtNum(m.net_token, 1) + " Tokens", sub: `คะแนนไฮบริดทุกสาย (${m.team_token_share_pct}% ของทีม ${m.team})`, col: "#A78BFA" };
}

function renderNav() {
  const nav = document.getElementById("chaptersNav");
  nav.innerHTML = CHAPTERS.map((c, idx) =>
    `<button class="chap-btn ${idx === currentSlide ? "active" : ""}" onclick="goSlide(${idx})">${c.label}</button>`
  ).join("");
  document.getElementById("progressFill").style.width = `${((currentSlide + 1) / CHAPTERS.length) * 100}%`;
  document.getElementById("slideIndicator").textContent = `บทที่ ${currentSlide + 1} / ${CHAPTERS.length} • ${CHAPTERS[currentSlide].label}`;
}

function goSlide(idx) {
  stopRace();
  currentSlide = Math.max(0, Math.min(CHAPTERS.length - 1, idx));
  renderNav();
  renderCurrentSlide();
}

function renderCurrentSlide() {
  const stage = document.getElementById("stage");
  const id = CHAPTERS[currentSlide].id;
  if (id === "cover") stage.innerHTML = viewCover();
  else if (id === "big") stage.innerHTML = viewBigNumbers();
  else if (id === "race") { stage.innerHTML = viewRace(); updateRaceView(); }
  else if (id === "teams") stage.innerHTML = viewTeams();
  else if (id === "backbone") stage.innerHTML = viewBackbone();
  else if (id === "tribes") stage.innerHTML = viewTribes();
  else stage.innerHTML = viewWall();
}

  const tot = REPLAY_DATA.club_annual_total;
  const teams = REPLAY_DATA.team_annual_fairness.map(t => {

    return `<span class="pill" style="border-color:${c.primary};background:${c.bg};color:${c.fg}">

  return `<div class="slide active">
    <div class="eyebrow">NTL SYNERGY TOKEN 2026 • CLUB YEAR REPLAY</div>
    <h1>ทุกก้าว ทุกหยดเหงื่อ<br><span style="color:var(--manda)">จากทั้ง ${meta.registered_members} คน</span></h1>

        <div class="big-num" style="color:var(--manda)">${fmtNum(tot.net_token, 1)}</div><div class="m-meta">คะแนนรวมทั้งชมรมตลอดปี</div></div>

      <div class="seg-group">
        <button class="seg-btn ${raceMode === "cumulative" ? "active" : ""}" onclick="setRaceMode('cumulative')">สะสม (Cumulative)</button>
        <button class="seg-btn ${raceMode === "monthly" ? "active" : ""}" onclick="setRaceMode('monthly')">รายเดือน (Monthly)</button>
      </div>
      <div class="seg-group">
        <button class="seg-btn ${raceMetric === "net_token" ? "active" : ""}" onclick="setRaceMetric('net_token')">Tokens</button>
        <button class="seg-btn ${raceMetric === "run_km" ? "active" : ""}" onclick="setRaceMetric('run_km')">วิ่ง km</button>
        <button class="seg-btn ${raceMetric === "walk_km" ? "active" : ""}" onclick="setRaceMetric('walk_km')">เดิน km</button>
        <button class="seg-btn ${raceMetric === "other_exercise_hours" ? "active" : ""}" onclick="setRaceMetric('other_exercise_hours')">อื่นๆ ชม.</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
        <div style="font-size:24px;font-weight:900" id="raceMonthLabel"></div>
        <input type="range" id="raceSlider" min="0" max="${REPLAY_DATA.club_monthly.length - 1}" value="${raceMonthIdx}" oninput="onScrub(this.value)" style="width:260px">
      </div>
      <div id="raceBars"></div>
    </div>
    <div class="card">
      <div style="font-weight:800;margin-bottom:6px">ยอดรวมชมรมรายเดือน (คลิกแท่งเพื่อกระโดดไปเดือนนั้น)</div>
      <div class="spark-wrap" id="raceClubSpark"></div>
    </div>
  </div>`;
}

function setRaceMode(m) { raceMode = m; renderCurrentSlide(); }
function setRaceMetric(m) { raceMetric = m; renderCurrentSlide(); }
function onScrub(v) { stopRace(); raceMonthIdx = Number(v); updateRaceView(); }
function stopRace() { if (raceTimer) { clearInterval(raceTimer); raceTimer = null; } const b = document.getElementById("racePlayBtn"); if (b) b.textContent = "▶ Play Animation"; }
function toggleRace() {
  if (raceTimer) { stopRace(); return; }
  if (raceMonthIdx >= REPLAY_DATA.club_monthly.length - 1) raceMonthIdx = 0;
  document.getElementById("racePlayBtn").textContent = "⏸ Pause";
  updateRaceView();
  raceTimer = setInterval(() => {
    if (raceMonthIdx < REPLAY_DATA.club_monthly.length - 1) {
      raceMonthIdx += 1;
      document.getElementById("raceSlider").value = raceMonthIdx;
      updateRaceView();
    } else {
      stopRace();
    }
  }, 700);
}

function updateRaceView() {
  const months = REPLAY_DATA.club_monthly.map(r => r.month);
  const currMonth = months[raceMonthIdx];
  const label = document.getElementById("raceMonthLabel");
  if (!label) return;
  const qtr = REPLAY_DATA.club_monthly[raceMonthIdx].quarter;
  const note = currMonth === "2026-04" ? " • ITSec เข้าร่วมสนามใน Q2!" : "";
  label.textContent = `${fmtM(currMonth)} 2026 (${qtr})${note}`;

  const teams = ["Mandalorian", "ITSec", "ITSystem"].map(t => {
    let val = 0;
    let act = 0;
    for (let i = 0; i <= raceMonthIdx; i++) {
      const row = REPLAY_DATA.team_monthly.find(x => x.month === months[i] && x.team === t);
      if (row) {
        if (raceMode === "cumulative") val += row[raceMetric];
        else if (i === raceMonthIdx) val = row[raceMetric];
        if (i === raceMonthIdx) act = row.active_members;
      }
    }
    return { team: t, val, act };
  }).sort((a, b) => b.val - a.val);

  const maxV = Math.max(...teams.map(t => t.val), 1);
  document.getElementById("raceBars").innerHTML = teams.map(t => {
    const c = TEAM_COLORS[t.team];
    const w = Math.max(2, (t.val / maxV) * 100);
    return `<div class="race-row">
      <div class="race-head"><span style="color:${c.fg}">${t.team} (${t.act} คน Active)</span><span>${fmtNum(t.val, 1)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${w.toFixed(1)}%;background:${c.primary}"></div></div>
    </div>`;
  }).join("");

  const maxClub = Math.max(...REPLAY_DATA.club_monthly.map(r => r[raceMetric]), 1);
  document.getElementById("raceClubSpark").innerHTML = REPLAY_DATA.club_monthly.map((r, i) => {
    const h = Math.max(8, (r[raceMetric] / maxClub) * 105);
    const active = i === raceMonthIdx;
    return `<div class="spark-col" style="cursor:pointer" onclick="onScrub(${i})">
      <div class="spark-val">${Math.round(r[raceMetric])}</div>
      <div class="spark-bar" style="height:${h}px;background:${active ? "var(--manda)" : "#334155"}"></div>
      <div class="spark-lbl" style="color:${active ? "#F8FAFC" : "var(--muted)"}">${fmtM(r.month)}</div>
    </div>`;
  }).join("");
}

function viewTeams() {
  const fair = [...REPLAY_DATA.team_annual_fairness];
  const isTotal = teamFairMode === "total";
  fair.sort((a, b) => isTotal ? b.net_token - a.net_token : b.token_per_active_member_month - a.token_per_active_member_month);
  const maxVal = Math.max(...fair.map(r => isTotal ? r.net_token : r.token_per_active_member_month), 1);
  return `<div class="slide active">
    <div class="eyebrow">3 TEAMS • FAIR PLAY BATTLE</div>
    <h2>สลับดูพลังทั้ง 2 มุมของ 3 ทีม</h2>
    <div class="controls-row">
      <div class="seg-group">
        <button class="seg-btn ${isTotal ? "active" : ""}" onclick="teamFairMode='total';renderCurrentSlide()">ยอดรวมทั้งทีม (Total Volume)</button>
        <button class="seg-btn ${!isTotal ? "active" : ""}" onclick="teamFairMode='per_capita';renderCurrentSlide()">เฉลี่ยต่อคน-เดือนที่ Active (Fair Per-Capita)</button>
      </div>
    </div>
    <div class="card">
      ${fair.map(r => {
        const c = TEAM_COLORS[r.team];
        const metricVal = isTotal ? r.net_token : r.token_per_active_member_month;
        const unit = isTotal ? "Tokens รวมทั้งปี" : "Tokens / คน-เดือน Active";
        const w = Math.max(8, (metricVal / maxVal) * 100);
        const sub = isTotal
          ? `วิ่ง ${fmtNum(r.run_km,1)} km • เดิน ${fmtNum(r.walk_km,1)} km • อื่นๆ ${fmtNum(r.other_exercise_hours,1)} ชม. (${r.registered_members} คน)`
          : `${r.note} • เฉลี่ย Active ${r.avg_active_members_per_month} คน/เดือน • วิ่ง ${fmtNum(r.run_km_per_active_member_month,1)} km/คน-เดือน`;
        return `<div class="race-row" style="margin-bottom:22px">
          <div class="race-head"><span style="font-size:20px;color:${c.fg}">${r.team}</span><span style="font-size:22px;color:${c.primary}">${fmtNum(metricVal, 2)} ${unit}</span></div>
          <div class="bar-track" style="height:24px"><div class="bar-fill" style="width:${w.toFixed(1)}%;background:${c.primary}"></div></div>
          <div class="m-meta">${sub}</div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function viewBackbone() {
  const t5 = REPLAY_DATA.top5_vs_backbone31.top5;
  const bb = REPLAY_DATA.top5_vs_backbone31.backbone_31;
  const rows = [
    ["Net Tokens", bb.net_token, bb.token_share_pct, t5.net_token, t5.token_share_pct, "Tokens"],
    ["ระยะวิ่ง (Run)", bb.run_km, bb.run_km_share_pct, t5.run_km, t5.run_km_share_pct, "km"],
    ["ระยะเดิน (Walk)", bb.walk_km, bb.walk_km_share_pct, t5.walk_km, t5.walk_km_share_pct, "km"],
    ["ออกกำลังกายอื่น", bb.other_exercise_hours, bb.other_hours_share_pct, t5.other_exercise_hours, t5.other_hours_share_pct, "ชม."],
  ];
  return `<div class="slide active">
    <div class="eyebrow">THE BACKBONE 31 • พลังของทุกคน</div>
    <h2><span style="color:var(--coral)">${fmtNum(bb.token_share_pct, 1)}%</span> ของชมรมมาจากอีก 31 คนนอก Top 5</h2>
    <p class="sub">ชมรมไม่ได้ยืนอยู่บนคน 5 คน — กำลังหลัก 31 คนสร้างระยะเดินถึง ${fmtNum(bb.walk_km_share_pct,1)}% และระยะวิ่ง ${fmtNum(bb.run_km_share_pct,1)}%</p>
    <div class="card">
      ${rows.map(([lbl, bv, bp, tv, tp, u]) => `
        <div class="race-row">
          <div class="race-head"><span>${lbl}</span><span>31 คน: ${fmtNum(bv,1)} ${u} (${bp}%) | Top 5: ${fmtNum(tv,1)} (${tp}%)</span></div>
          <div class="bar-track" style="height:26px;display:flex;background:transparent;gap:4px">
            <div style="width:${bp}%;background:var(--itsys);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#052e16">31 คน (${bp}%)</div>
            <div style="width:${tp}%;background:var(--manda);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#082f49">${tp}%</div>
          </div>
        </div>
      `).join("")}
    </div>
  </div>`;
}

function viewTribes() {
  const members = REPLAY_DATA.member_contributions_36;
  const pillars = ["Run", "Other", "Hybrid", "Walk"];
  const list = tribeFilter === "All" ? pillars : [tribeFilter];
  return `<div class="slide active">
    <div class="eyebrow">FOUR TRIBES OF NTL • 4 สายพันธุ์</div>
    <h2>ทุกคนมีสไตล์ที่ถนัดต่างกัน</h2>
    <div class="controls-row">
      <div class="seg-group">
        <button class="seg-btn ${tribeFilter==="All"?"active":""}" onclick="tribeFilter='All';renderCurrentSlide()">ทุกสาย (36)</button>
        ${pillars.map(p => `<button class="seg-btn ${tribeFilter===p?"active":""}" onclick="tribeFilter='${p}';renderCurrentSlide()">${TRIBE_INFO[p].th} (${members.filter(m=>m.primary_pillar===p).length})</button>`).join("")}
      </div>
    </div>
    <div class="grid-2">
      ${list.map(p => {
        const info = TRIBE_INFO[p];
        const items = members.filter(m => m.primary_pillar === p).sort((a,b) => b.net_token - a.net_token);
        return `<div class="card" style="border-color:${info.color}66">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div><div class="eyebrow" style="color:${info.color}">${info.code}</div><div style="font-size:24px;font-weight:800">${info.th}</div></div>
            <span class="pill" style="color:${info.color};border-color:${info.color}">${items.length} คน</span>
          </div>
          <div>${items.map(m => `<span class="tribe-pill" onclick="openMember('${m.name}')">
            <span class="dot" style="background:${TEAM_COLORS[m.team].primary}"></span>${m.name}</span>`).join("")}</div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function viewWall() {
  const members = REPLAY_DATA.member_contributions_36.filter(m =>
    (wallTeamFilter === "All" || m.team === wallTeamFilter) &&
    m.name.toLowerCase().includes(wallSearch.toLowerCase())
  );
  return `<div class="slide active">
    <div class="eyebrow">WALL OF 36 • EVERY MEMBER MATTERS</div>
    <h2>คลิกชื่อเพื่อเปิดการ์ด Year Replay ส่วนตัว</h2>
    <div class="controls-row">
      <div class="seg-group">
        ${["All", "Mandalorian", "ITSec", "ITSystem"].map(t =>
          `<button class="seg-btn ${wallTeamFilter===t?"active":""}" onclick="wallTeamFilter='${t}';renderCurrentSlide()">${t === "All" ? "ทั้งหมด (36)" : t}</button>`
        ).join("")}
      </div>
      <input class="search-input" type="text" placeholder="ค้นหาชื่อสมาชิก..." value="${wallSearch}" oninput="wallSearch=this.value;renderCurrentSlide();document.querySelector('.search-input').focus();">
    </div>
    <div class="wall-grid">
      ${members.map(m => {
        const tc = TEAM_COLORS[m.team];
        const h = heroInfo(m);
        const tr = TRIBE_INFO[m.primary_pillar] || TRIBE_INFO.Hybrid;
        return `<div class="m-tile" style="border-left-color:${tc.primary}" onclick="openMember('${m.name}')">
          <div class="m-tile-top"><span class="m-name">${m.name}</span><span class="m-team" style="color:${tc.primary}">${m.team}</span></div>
          <div class="m-hero" style="color:${h.col}">${h.val}</div>
          <div class="m-meta">${tr.th} • ${fmtNum(m.net_token,1)} Tok • Peak ${fmtM(m.peak_month)}</div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function openMember(name) {
  const m = REPLAY_DATA.member_contributions_36.find(x => x.name.toLowerCase() === name.toLowerCase());
  if (!m) return;
  window.location.hash = "member=" + encodeURIComponent(m.name);
  const tc = TEAM_COLORS[m.team];
  const tr = TRIBE_INFO[m.primary_pillar] || TRIBE_INFO.Hybrid;
  const h = heroInfo(m);
  const months = REPLAY_DATA.club_monthly.map(r => r.month);
  const map = memberMonths[m.name] || {};
  const maxM = Math.max(...months.map(k => map[k] || 0), 1);

  const spark = months.map(k => {
    const v = map[k] || 0;
    const isPeak = k === m.peak_month && v > 0;
    const bh = v > 0 ? Math.max(8, (v / maxM) * 90) : 4;
    return `<div class="spark-col">
      <div class="spark-val">${v > 0 ? Math.round(v) : ""}</div>
      <div class="spark-bar" style="height:${bh}px;background:${isPeak ? tc.primary : (v > 0 ? "#475569" : "#1E293B")}"></div>
      <div class="spark-lbl">${fmtM(k)}</div>
    </div>`;
  }).join("");

  document.getElementById("modalContent").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span class="pill" style="color:${tc.fg};background:${tc.bg};border-color:${tc.primary}">${m.team} • ACTIVE ${m.active_months} เดือน</span>
      <button class="btn" onclick="closeModal()">ปิด ✕</button>
    </div>
    <h2 style="margin-bottom:6px">${m.name}</h2>
    <span class="pill" style="color:${tr.color};border-color:${tr.color};margin-bottom:16px">${tr.code} • ${tr.th}</span>
    <div class="card" style="border-color:${h.col};margin-bottom:14px">
      <div class="eyebrow" style="color:${h.col}">SIGNATURE PILLAR</div>
      <div class="big-num" style="color:${h.col}">${h.val}</div>
      <div class="m-meta" style="font-size:15px">${h.sub}</div>
    </div>
    <div class="grid-4" style="margin-bottom:14px">
      <div class="card"><div class="m-meta">Net Tokens</div><div style="font-size:26px;font-weight:900">${fmtNum(m.net_token,1)}</div></div>
      <div class="card"><div class="m-meta">ระยะวิ่ง</div><div style="font-size:26px;font-weight:900">${fmtNum(m.run_km,1)} km</div></div>
      <div class="card"><div class="m-meta">ระยะเดิน</div><div style="font-size:26px;font-weight:900">${fmtNum(m.walk_km,1)} km</div></div>
      <div class="card"><div class="m-meta">ออกกำลังกายอื่น</div><div style="font-size:26px;font-weight:900">${fmtNum(m.other_exercise_hours,1)} ชม.</div></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;font-weight:800"><span>จังหวะรายเดือน</span><span style="color:${tc.primary}">Peak: ${fmtM(m.peak_month)} (${fmtNum(m.peak_month_token,1)} Tok)</span></div>
      <div class="spark-wrap" style="height:130px">${spark}</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <span style="font-weight:700;color:${tc.fg}">เติมพลังให้ทีม ${m.team} ${m.team_token_share_pct}% (${m.activity_count} กิจกรรม)</span>
      <button class="btn btn-primary" onclick="downloadMemberPng('${m.name}')">บันทึกรูปการ์ด (PNG 1080×1350)</button>
    </div>`;
  document.getElementById("memberModal").classList.add("open");
}

function closeModal() {
  document.getElementById("memberModal").classList.remove("open");
  if (window.location.hash.startsWith("#member=")) history.replaceState(null, "", "#");
}

function downloadMemberPng(name) {
  const m = REPLAY_DATA.member_contributions_36.find(x => x.name === name);
  if (!m) return;
  const tc = TEAM_COLORS[m.team];
  const h = heroInfo(m);
  const tr = TRIBE_INFO[m.primary_pillar] || TRIBE_INFO.Hybrid;
  const cv = document.createElement("canvas");
  cv.width = 1080; cv.height = 1350;
  const ctx = cv.getContext("2d");
  const g = ctx.createLinearGradient(0, 0, 1080, 1350);
  g.addColorStop(0, "#070B14"); g.addColorStop(1, "#0F172A");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1350);
  ctx.fillStyle = tc.fg; ctx.font = "700 24px sans-serif";
  ctx.fillText("NTL CLUB 2026 • MY YEAR REPLAY", 60, 88);
  ctx.fillStyle = "#F8FAFC"; ctx.font = "800 68px sans-serif";
  ctx.fillText(m.name, 60, 190);
  ctx.fillStyle = tr.color; ctx.font = "700 26px sans-serif";
  ctx.fillText(`${m.team} • ${tr.th} • ACTIVE ${m.active_months} เดือน`, 60, 240);
  ctx.fillStyle = "#111827"; ctx.strokeStyle = h.col; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(60, 290, 960, 250, 26); ctx.fill(); ctx.stroke();
  ctx.fillStyle = h.col; ctx.font = "700 24px sans-serif";
  ctx.fillText("SIGNATURE PILLAR", 96, 344);
  ctx.fillStyle = "#F8FAFC"; ctx.font = "900 102px sans-serif";
  ctx.fillText(h.val, 96, 452);
  ctx.fillStyle = "#CBD5E1"; ctx.font = "600 25px sans-serif";
  ctx.fillText(h.sub, 96, 504);

  const cards = [
    ["NET TOKENS", fmtNum(m.net_token,1)],
    ["ระยะวิ่ง (RUN)", fmtNum(m.run_km,1) + " km"],
    ["ระยะเดิน (WALK)", fmtNum(m.walk_km,1) + " km"],
    ["ออกกำลังกายอื่น", fmtNum(m.other_exercise_hours,1) + " ชม."],
  ];
  cards.forEach(([lbl, val], idx) => {
    const bx = 60 + (idx % 2) * 492, by = 574 + Math.floor(idx / 2) * 165;
    ctx.fillStyle = "#111827"; ctx.strokeStyle = "#334155"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(bx, by, 468, 142, 22); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#94A3B8"; ctx.font = "700 22px sans-serif"; ctx.fillText(lbl, bx + 28, by + 44);
    ctx.fillStyle = "#F8FAFC"; ctx.font = "800 54px sans-serif"; ctx.fillText(val, bx + 28, by + 110);
  });

  const months = REPLAY_DATA.club_monthly.map(r => r.month);
  const map = memberMonths[m.name] || {};
  const maxM = Math.max(...months.map(k => map[k] || 0), 1);
  ctx.fillStyle = "#111827"; ctx.beginPath(); ctx.roundRect(60, 910, 960, 240, 24); ctx.fill();
  ctx.fillStyle = "#E2E8F0"; ctx.font = "700 24px sans-serif";
  ctx.fillText(`MONTHLY RHYTHM • PEAK: ${fmtM(m.peak_month)} (${fmtNum(m.peak_month_token,1)} Tok)`, 96, 956);
  const slot = 888 / months.length;
  months.forEach((k, i) => {
    const v = map[k] || 0, cx = 96 + i * slot + slot / 2;
    if (v > 0) {
      const bh = Math.max(10, (v / maxM) * 110);
      ctx.fillStyle = k === m.peak_month ? tc.primary : "#475569";
      ctx.fillRect(cx - 22, 1104 - bh, 44, bh);
    }
    ctx.fillStyle = "#94A3B8"; ctx.font = "700 18px sans-serif";
    ctx.fillText(fmtM(k), cx - 16, 1132);
  });

  ctx.fillStyle = tc.bg; ctx.beginPath(); ctx.roundRect(60, 1180, 960, 74, 20); ctx.fill();
  ctx.fillStyle = "#F8FAFC"; ctx.font = "700 24px sans-serif";
  ctx.fillText(`เติมพลังให้ทีม ${m.team} ${m.team_token_share_pct}% (${m.activity_count} กิจกรรม)`, 96, 1226);

  const a = document.createElement("a");
  a.download = `${m.name}_year_replay_2026.png`;
  a.href = cv.toDataURL("image/png");
  a.click();
}

document.getElementById("prevBtn").onclick = () => goSlide(currentSlide - 1);
document.getElementById("nextBtn").onclick = () => goSlide(currentSlide + 1);
document.getElementById("openPickerBtn").onclick = () => goSlide(6);
document.getElementById("fullscreenBtn").onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
};
document.getElementById("memberModal").onclick = (e) => { if (e.target.id === "memberModal") closeModal(); };
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); goSlide(currentSlide + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); goSlide(currentSlide - 1); }
  else if (e.key === "Escape") closeModal();
  else if (e.key.toLowerCase() === "f") document.getElementById("fullscreenBtn").click();
});

renderNav();
renderCurrentSlide();
if (window.location.hash.startsWith("#member=")) {
  openMember(decodeURIComponent(window.location.hash.slice(8)));
}
</script>
</body>
</html>
